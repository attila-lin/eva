[package]
name = "eva"
version = "0.3.1"
authors = ["NerdyPepper <akshayoppiliappan@gmail.com>"]
edition = "2024"
description = "Calculator REPL similar to bc(1)"
homepage = "https://github.com/nerdypepper/eva"
repository = "https://github.com/nerdypepper/eva"
readme = "./readme.md"
keywords = ["bc", "calculator", "cli", "math", "repl"]
categories = ["command-line-interface", "parser-implementations", "science"]
license = "MIT"

[lib]
name = "eva"
path = "src/lib.rs"

[[bin]]
name = "eva"
required-features = ["build-binary"]

[dependencies]
clap = { version = "4.0", features = ["cargo"], optional = true }
directories = { version = "6.0.0", optional = true }
num = "0.4.0"
once_cell = "1.12.0"
regex = "1.5.6"
rustyline = { version = "16.0.0", default-features = false, features = [
  "with-file-history"
], optional = true }
terminal_size = "0.4.2"

# TODO move this into a crate instead of requiring a feature
[features]
build-binary = ["clap", "directories", "rustyline"]
